- from:
    uri: "file:../../sources/openstack/node/output"
    parameters:
      fileName: "output.ttl"
      noop: true
    steps:
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "file:../../sources/openstack/interface/output"
    parameters:
      fileName: "output.ttl"
      noop: true
    steps:
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "file:../../sources/openstack/ip-network/output"
    parameters:
      fileName: "output.ttl"
      noop: true
    steps:
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "file:../../sources/openstack/link/output"
    parameters:
      fileName: "output.ttl"
      noop: true
    steps:
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "file:../../sources/docker-image/input"
    parameters:
      fileName: "input.ttl"
      noop: true
    steps:
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "timer:once?repeatCount=1&delay=1000"
    steps:
      - to:
          uri: "https://raw.githubusercontent.com/Mouseworld-Lab/mouseworld-ontology/refs/heads/develop/ontology/topology.ttl"
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "timer:once?repeatCount=1&delay=1000"
    steps:
      - to:
          uri: "https://raw.githubusercontent.com/Mouseworld-Lab/mouseworld-ontology/refs/heads/develop/ontology/routing.ttl"
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "timer:once?repeatCount=1&delay=1000"
    steps:
      - to:
          uri: "https://raw.githubusercontent.com/Mouseworld-Lab/mouseworld-ontology/refs/heads/develop/ontology/platform.ttl"
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "timer:once?repeatCount=1&delay=1000"
    steps:
      - to:
          uri: "https://raw.githubusercontent.com/Mouseworld-Lab/mouseworld-ontology/refs/heads/develop/ontology/infra.ttl"
      - to:
          uri: "direct:storeTriplestore"

- from:
    uri: "direct:storeTriplestore"
    steps:
      - to:
          uri: "graph://get"
          parameters:
            serverUrl: "http://127.0.0.1:7200"
            repositoryId: "default"
            rdfFormat: "turtle"
            defaultGraph: true
      - log:
          message: "File stored in remote triplestore"
