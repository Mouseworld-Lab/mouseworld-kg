
######################
# BEANS
######################

- beans:
  - name: selectNodeQuery
    type: "#class:com.cefriel.util.ChimeraResourceBean"
    properties:
      url: "file://./files/select-node.txt"
      serializationFormat: "txt"
  - name: loweringMappingTemplate
    type: "#class:com.cefriel.util.ChimeraResourceBean"
    properties:
      url: "file://./files/mappings.vm"
      serializationFormat: "vtl"

######################
# ROUTES
######################

- from:
    uri: "file:input"
    parameters:
      fileName: "input.ttl"
      noop: true
    steps:
      - to:
          uri: "seda:lowering"

- from:
    id: lowering
    uri: "seda:lowering"
    steps:
      - to:
          uri: "mapt://rdf"
          parameters:
            template: "#bean:loweringMappingTemplate"
            query: "#bean:selectNodeQuery"
      - to:
          uri: "seda:store"

- from:
    id: store
    uri: "seda:store"
    steps:
      - split:
          expression:
            simple: "${body}"
      - setHeader:
          name: routerId
          simple: "${body.key}"
      - setBody:
          simple: "${body.value}"
      - log:
          message: "routerId header: ${header.routerId}"
      - log:
          message: "Body is ${body}"
      - to:
          uri: "file:output"
          parameters:
            fileName: ${header.routerId}.conf
            noop: true
      - log:
          message: "Lowering has been generated and saved to output/${header.routerId}.conf"

