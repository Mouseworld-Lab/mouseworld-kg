
######################
# BEANS
######################

- beans:
  - name: constructGraph
    type: "#class:com.cefriel.util.ChimeraResourceBean"
    properties:
      url: "file://./files/construct.txt"
      serializationFormat: "txt"
  - name: selectNodeQuery
    type: "#class:com.cefriel.util.ChimeraResourceBean"
    properties:
      url: "file://./files/select-node.txt"
      serializationFormat: "txt"
  - name: loweringMappingTemplate
    type: "#class:com.cefriel.util.ChimeraResourceBean"
    properties:
      url: "file://./files/mappings.vm"
      serializationFormat: "vtl"

######################
# ROUTES
######################

- from:
    id: connectGraph
    uri: "timer:run-once?repeatCount=1&delay=1000"
    steps:
      - to:
          uri: "graph://get"
          parameters:
            serverUrl: http://127.0.0.1:7200
            repositoryId: default
            defaultGraph: true
      - to:
          uri: "seda:getConfigGraph"

- from:
    id: getConfigGraph
    uri: "seda:getConfigGraph"
    steps:
      - to:
          uri: "graph://construct"
          parameters:
            newGraph: true
            chimeraResource: "#bean:constructGraph"
      - to:
          uri: "seda:lowering"

- from:
    id: lowering
    uri: "seda:lowering"
    steps:
      - to:
          uri: "mapt://rdf"
          parameters:
            template: "#bean:loweringMappingTemplate"
            query: "#bean:selectNodeQuery"
      - to:
          uri: "seda:store"

- from:
    id: store
    uri: "seda:store"
    steps:
      - split:
          expression:
            simple: "${body}"
      - setHeader:
          name: routerId
          simple: "${body.key}"
      - setBody:
          simple: "${body.value}"
      - to:
          uri: "file:output"
          parameters:
            fileName: ${header.routerId}.conf
            noop: true
      - log:
          message: "Lowering has been generated and saved to output/${header.routerId}.conf"
